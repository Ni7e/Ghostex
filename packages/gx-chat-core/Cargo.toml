# CDXC:SessionChat 2026-09-21 DECISION:
# User: the desktop chat's brain stops running in QuickJS; the rules move to Rust and the same code runs in the mobile app and the web build.
# This crate is that brain's platform-neutral core. It owns the "what to draw" document the renderers already consume byte for byte, so no drawing code changes. Inputs are events (gxserver chat frames, user actions, clock ticks); outputs are the document plus effects the host performs. It must stay free of gpui, threads, sockets, the file system, and clock reads (the host passes `now_ms`), and must build for wasm32-unknown-unknown, because mobile (UniFFI) and the web build embed it next.
[package]
name = "ghostex-gx-chat-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ghostex_gx_chat_core"
path = "src/lib.rs"

[dependencies]
ghostex-gx-protocol = { path = "../gx-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
