<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostex Manage</title>
    <style>
      html,
      body {
        background: #0e0e0e;
        margin: 0;
      }

      html[data-workarea-theme='light'],
      html[data-workarea-theme='light'] body {
        background: #ffffff;
        transition: none;
      }
    </style>
    <script>
      // CDXC:Theming 2026-09-13 WHY:
      // CEF can paint this document before manage-main installs the theme, causing a dark flash when selecting Docs in the titlebar.
      // Keep the first paint aligned with the native appTheme parameter and views/workarea-theme.ts, including the shared body background transition.
      (() => {
        const theme = new URLSearchParams(location.search).get('appTheme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.workareaTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./sidebar/manage-main.tsx"></script>
  </body>
</html>
