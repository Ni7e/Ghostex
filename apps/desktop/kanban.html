<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghostex Kanban</title>
    <style>
      html,
      body {
        background: #0e0e0e;
        margin: 0;
      }

      html[data-workarea-theme='light'],
      html[data-workarea-theme='light'] body {
        background: #ffffff;
        transition: none;
      }
    </style>
    <script>
      // CDXC:Theming 2026-09-13 WHY:
      // Kanban and Automate share this document, which CEF can paint before kanban-main installs the app theme.
      // Keep the first paint aligned with the native appTheme parameter and views/workarea-theme.ts, as in manage.html.
      (() => {
        const theme = new URLSearchParams(location.search).get('appTheme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.workareaTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./sidebar/kanban-main.tsx"></script>
  </body>
</html>
