name: Release assemble

on:
  workflow_dispatch:
    inputs:
      version: { description: "Semver release version", required: true, type: string }
      source_sha: { description: "Immutable application source commit", required: true, type: string }
      channel: { description: "Release channel", required: false, default: stable, type: choice, options: [stable, prerelease, test] }
      update_sparkle: { description: "Publish production Sparkle last", required: true, default: true, type: boolean }
      prerequisite_run_id: { description: "Optional prerequisite workflow run", required: false, type: string }

permissions:
  actions: read
  contents: write

concurrency:
  group: release-assemble-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 0, submodules: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.6 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - name: Read immutable package scope
        id: scope
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          packages="$(node scripts/release-resumable.mjs show-state "${{ inputs.version }}" | jq -c '.packages // ["android", "gxserver-linux-x64", "gxserver-linux-arm64", "macos-arm64"]')"
          [[ "$(jq -r 'index("android") != null' <<<"$packages")" == "true" ]] && echo "android=true" >> "$GITHUB_OUTPUT" || echo "android=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        if: ${{ steps.scope.outputs.android == 'true' }}
        with: { distribution: temurin, java-version: '17.0.15+6' }
      - name: Install pinned Android verifier
        if: ${{ steps.scope.outputs.android == 'true' }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - name: Verify staged allowlist, publish GitHub, then publish Sparkle
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: node scripts/release-assemble-resumable.mjs "${{ inputs.version }}" "${{ inputs.source_sha }}"
