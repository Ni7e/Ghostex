name: GPUI release - publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      expected_platforms:
        required: true
        type: string
      prerelease:
        required: false
        default: false
        type: boolean
      update_sparkle:
        required: false
        default: true
        type: boolean
      windows_signed:
        required: false
        default: true
        type: boolean
      source_run_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      expected_platforms:
        description: Comma-separated platform manifest names
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: false
        default: true
        type: boolean
      update_sparkle:
        description: Commit and publish the Sparkle appcast
        required: false
        default: false
        type: boolean
      windows_signed:
        description: Windows artifacts are Authenticode-signed
        required: false
        default: false
        type: boolean
      source_run_id:
        description: Completed release workflow run containing all artifacts
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id == '' }}
        with:
          path: build/release-gpui/workflow-artifacts
      - uses: actions/download-artifact@v4
        if: ${{ inputs.source_run_id != '' }}
        with:
          path: build/release-gpui/workflow-artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_RELEASE_EXPECTED_PLATFORMS: ${{ inputs.expected_platforms }}
          GHOSTEX_RELEASE_PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          GHOSTEX_RELEASE_WINDOWS_SIGNED: ${{ inputs.windows_signed && '1' || '0' }}
        run: node scripts/release-gpui/assemble.mjs "${{ inputs.version }}" build/release-gpui/workflow-artifacts
