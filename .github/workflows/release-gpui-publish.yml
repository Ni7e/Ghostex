name: GPUI release - publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      expected_platforms:
        required: true
        type: string
      prerelease:
        required: false
        default: false
        type: boolean
      update_sparkle:
        required: false
        default: true
        type: boolean
      windows_signed:
        required: false
        default: true
        type: boolean
      source_run_id:
        required: false
        default: ""
        type: string
      plan:
        description: Resolved release plan JSON from the prepare job
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version
        required: true
        type: string
      expected_platforms:
        description: Comma-separated platform manifest names
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: false
        default: true
        type: boolean
      update_sparkle:
        description: Commit and publish the Sparkle appcast
        required: false
        default: false
        type: boolean
      windows_signed:
        description: Windows artifacts are Authenticode-signed
        required: false
        default: false
        type: boolean
      source_run_id:
        description: Completed release workflow run containing all artifacts
        required: true
        type: string
      plan:
        description: >-
          Resolved release plan JSON recorded by the source run. Leave empty to
          use the run's own release-plan artifact.
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ghostex-gpui-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@v8
        if: ${{ inputs.source_run_id == '' }}
        with:
          path: build/release-gpui/workflow-artifacts
      - uses: actions/download-artifact@v8
        if: ${{ inputs.source_run_id != '' }}
        with:
          path: build/release-gpui/workflow-artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSTEX_RELEASE_EXPECTED_PLATFORMS: ${{ inputs.expected_platforms }}
          # CDXC:ReleaseChangeAwarePlanning 2026-08-13: the resolved plan decides
          # what this release contains. assemble.mjs cross-checks plan <->
          # manifest <-> provenance for every product, emits
          # release-provenance-<version>.json, and refuses a mixed set. When this
          # input is empty the run's own `release-plan` artifact is used, and when
          # both exist they must agree exactly.
          GHOSTEX_RELEASE_PLAN: ${{ inputs.plan }}
          # Every freshly built artifact in the set must come from one Actions
          # run: this one, or the nominated source run of a publish-only
          # recovery. Reused artifacts legitimately name a foreign origin run.
          GHOSTEX_RELEASE_SOURCE_RUN_ID: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          GHOSTEX_RELEASE_PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
          GHOSTEX_RELEASE_UPDATE_SPARKLE: ${{ inputs.update_sparkle && '1' || '0' }}
          GHOSTEX_RELEASE_WINDOWS_SIGNED: ${{ inputs.windows_signed && '1' || '0' }}
        run: node scripts/release-gpui/assemble.mjs "${{ inputs.version }}" build/release-gpui/workflow-artifacts
