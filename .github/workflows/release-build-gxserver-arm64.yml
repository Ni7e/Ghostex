name: Release build - gxserver Linux ARM64

on:
  workflow_dispatch:
    inputs:
      version: { description: "Semver release version", required: true, type: string }
      source_sha: { description: "Immutable application source commit", required: true, type: string }
      channel: { description: "Release channel", required: true, default: stable, type: choice, options: [stable, prerelease, test] }
      update_sparkle: { description: "Whether assembly may eventually update Sparkle", required: true, default: true, type: boolean }
      prerequisite_run_id: { description: "Optional prerequisite workflow run", required: false, type: string }

permissions: { actions: write, contents: write }

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: "${{ inputs.source_sha }}", fetch-depth: 0, submodules: false }
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, path: .release-automation, fetch-depth: 1, submodules: false }
      - name: Verify immutable source
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.6 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - name: Install pinned build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake=3.28.3-1build7 ninja-build=1.11.1-2 pkg-config=1.8.1-2build1
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          curl -fsSL https://mise.run | MISE_VERSION=2026.7.7 sh
          "$HOME/.local/bin/mise" install zig@0.15.2 zig@0.16.0
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: bun install --frozen-lockfile
      - name: Prepare source dependencies
        env: { GHOSTEX_RELEASE_REPO_ROOT: "${{ github.workspace }}" }
        run: GHOSTEX_RELEASE_SKIP_GPUI_REFERENCES=1 .release-automation/scripts/release-gpui/prepare-references.sh
      - name: Build gxserver Linux ARM64
        env:
          GHOSTEX_RELEASE_AUTOMATION_ROOT: ${{ github.workspace }}/.release-automation
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          BEADS_ROOT="$(cd ../.. && pwd)/_references/beads" .release-automation/scripts/build-remote-gxserver-linux-release.sh --arch arm64
          OUTPUT="build/release-gpui/${{ inputs.version }}/gxserver-linux-arm64"
          mkdir -p "$OUTPUT"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C build/remote-gxserver-linux/arm64/package -czf "$OUTPUT/gxserver-linux-arm64.tar.gz" .
          source .release-automation/scripts/release-gpui/common.sh
          release_gpui_write_manifest "$OUTPUT" gxserver-linux-arm64 "${{ inputs.version }}" "$OUTPUT/gxserver-linux-arm64.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-gxserver-linux-arm64
          path: build/release-gpui/${{ inputs.version }}/gxserver-linux-arm64/
          if-no-files-found: error
          retention-days: 90
  stage:
    needs: build
    runs-on: ubuntu-24.04
    concurrency: { group: "release-state-${{ inputs.version }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: "${{ inputs.version }}-${{ inputs.source_sha }}-gxserver-linux-arm64", path: build/stage/gxserver }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: node scripts/release-resumable.mjs stage-package-and-advance "${{ inputs.version }}" "${{ inputs.source_sha }}" gxserver-linux-arm64 build/stage/gxserver "$(git rev-parse HEAD)" "${{ inputs.channel }}" "${{ inputs.update_sparkle }}"
