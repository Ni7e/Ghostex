name: Release build - iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version: { description: "Semver release version", required: true, type: string }
      source_sha: { description: "Immutable application source commit", required: true, type: string }
      channel: { description: "Release channel", required: true, default: stable, type: choice, options: [stable, prerelease, test] }
      update_sparkle: { description: "Whether assembly may eventually update Sparkle", required: true, default: true, type: boolean }
      prerequisite_run_id: { description: "Optional prerequisite workflow run", required: false, type: string }

permissions:
  actions: write
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Select Expo 57 toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app
      - name: Check out immutable application source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: false
      - name: Check out current release automation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          path: .release-automation
          fetch-depth: 1
          submodules: false
      - name: Verify source and workflow revisions
        run: |
          node .release-automation/scripts/release-resumable.mjs validate-source "${{ inputs.version }}" "${{ inputs.source_sha }}"
          echo "GHOSTEX_RELEASE_WORKFLOW_SHA=$(git -C .release-automation rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '/.release-automation/\n' >> .git/info/exclude
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - name: Restore pinned React Native sources
        env:
          MOBILE_DEPLOY_KEY: ${{ secrets.GHOSTEX_MOBILE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$MOBILE_DEPLOY_KEY"
          mkdir -p "$RUNNER_TEMP/mobile-ssh"
          printf '%s\n' "$MOBILE_DEPLOY_KEY" > "$RUNNER_TEMP/mobile-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/mobile-ssh/id_ed25519"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/mobile-ssh/known_hosts"
          git config submodule.mobile.url git@github.com:maddada/ghostex-mobile.git
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/mobile-ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/mobile-ssh/known_hosts" \
            git submodule update --init --depth 1 mobile
      - name: Install JavaScript dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile
      - name: Install App Store Connect API key
        env:
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APPLE_ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_BASE64" && test -n "$ASC_KEY_ID"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "GHOSTEX_ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "GHOSTEX_ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "GHOSTEX_ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"
      - name: Build, validate, and upload to TestFlight
        env:
          GHOSTEX_RELEASE_REPO_ROOT: ${{ github.workspace }}
          GHOSTEX_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: .release-automation/scripts/release-mobile/ios-testflight.sh "${{ inputs.version }}"
      - name: Preserve TestFlight upload attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-ios-testflight
          path: build/release-gpui/${{ inputs.version }}/ios-testflight/
          if-no-files-found: error
          retention-days: 90

  record:
    needs: build-and-upload
    runs-on: ubuntu-24.04
    concurrency:
      group: release-state-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24.13.1 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.version }}-${{ inputs.source_sha }}-ios-testflight
          path: build/stage/ios-testflight
      - name: Record accepted TestFlight upload and advance release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ATTESTATION=build/stage/ios-testflight/testflight-attestation.json
          test "$(jq -r .status "$ATTESTATION")" = uploaded
          node scripts/release-resumable.mjs record-testflight-and-advance \
            "${{ inputs.version }}" \
            "${{ inputs.source_sha }}" \
            "$(jq -r .build_number "$ATTESTATION")" \
            "$(jq -r .bundle_id "$ATTESTATION")" \
            "$(git rev-parse HEAD)" \
            "${{ inputs.channel }}" \
            "${{ inputs.update_sparkle }}"
