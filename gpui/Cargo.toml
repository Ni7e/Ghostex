# CDXC:GPUITestingPolicy 2026-06-27-12:06: GPUI app tests are intentionally absent while product behavior is still moving. Lock GPUI behavior down with tests later, and keep test suites for other Ghostex projects intact.
[package]
name = "ghostex-gpui"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "ghostex-gpui"
path = "src/main.rs"

[[bin]]
name = "ghostex-gpui-cef-helper"
path = "src/bin/ghostex_gpui_cef_helper.rs"

[dependencies]
anyhow = "1"
cef = { path = "../../../_references/cef-rs/cef", default-features = false }
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { path = "../../../_references/gpui-component/crates/ui" }
raw-window-handle = "0.6"
serde_json = "1"

[build-dependencies]
cc = "1"

[patch."https://github.com/zed-industries/zed"]
gpui = { path = "../../../_references/zed/crates/gpui" }
gpui_macros = { path = "../../../_references/zed/crates/gpui_macros" }
gpui_platform = { path = "../../../_references/zed/crates/gpui_platform" }
gpui_shared_string = { path = "../../../_references/zed/crates/gpui_shared_string" }
gpui_util = { path = "../../../_references/zed/crates/gpui_util" }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
