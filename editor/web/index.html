<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0"
      name="viewport"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        width: 100%;
      }

      body {
        background: #1e1e1e;
        color: #d4d4d4;
      }

      #root {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .editor-header {
        align-items: center;
        background: #252526;
        border-bottom: 1px solid #3c3c3c;
        box-sizing: border-box;
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
        min-height: 38px;
        padding: 5px 8px 5px 12px;
      }

      .editor-title {
        color: #cccccc;
        flex: 0 1 auto;
        font-size: 13px;
        font-weight: 500;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .editor-hint {
        color: #8f8f8f;
        flex: 1 1 auto;
        font-size: 12px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .editor-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 6px;
      }

      button {
        appearance: none;
        background: #333333;
        border: 1px solid #555555;
        border-radius: 4px;
        color: #e5e5e5;
        cursor: default;
        font: inherit;
        font-size: 12px;
        line-height: 1;
        min-width: 64px;
        padding: 6px 10px;
      }

      button:hover {
        background: #3f3f46;
        border-color: #6a6a6a;
      }

      button:active {
        background: #2d2d30;
      }

      .save-button {
        background: #0e639c;
        border-color: #1177bb;
        color: #ffffff;
      }

      .save-button:hover {
        background: #1177bb;
      }

      #editor {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
    </style>
    <script src="./monaco/vs/loader.js"></script>
  </head>
  <body>
    <div id="root">
      <header class="editor-header">
        <div
          class="editor-title"
          id="editor-title"
        ></div>
        <div
          class="editor-hint"
          id="editor-hint"
        ></div>
        <div class="editor-actions">
          <button
            id="cancel-button"
            type="button"
          >
            Cancel
          </button>
          <button
            class="save-button"
            id="save-button"
            type="button"
          >
            Save
          </button>
        </div>
      </header>
      <main id="editor"></main>
    </div>
    <script>
      __GHOSTEX_EDITOR_BUNDLE__
    </script>
  </body>
</html>
